    url = "/milli/"
    weight = -1
  [[menus.main]]
    name = "Maç Önü"
    url = "/kategoriler/mac-onu/"
    weight = 1
  [[menus.main]]
    name = "Maç Sonu"
    url = "/kategoriler/mac-sonu/"
    weight = 2
  [[menus.main]]
