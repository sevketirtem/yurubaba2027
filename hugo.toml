baseURL = "https://yurubaba.com/"
languageCode = "tr"
defaultContentLanguage = "tr"
title = "Yürü Baba"
timeZone = "Europe/Istanbul"
enableRobotsTXT = true
summaryLength = 40

# RSS'te yalnızca son 50 sayfa (yazılar önce gelir; tarihsiz maç/takım sayfaları sona düşer)
[services.rss]
  limit = 50

[pagination]
  pagerSize = 10

[taxonomies]
  kategori = "kategoriler"

[permalinks]
  [permalinks.page]
    posts = "/:year/:month/:contentbasename/"

[params]
  slogan = "Hadi'ye inanma, gerçekleri biz yazarız."
  description = "Türk futbolunu soğukkanlı, istatistikle ve kuru mizahla yorumlayan site. Ekim'de şampiyon olunmaz."
  # Tema renkleri: iki site aynı iskeleti, farklı renklerle kullanır
  accent = "#1f3a5f"
  accentInk = "#ffffff"
  # Paylaşım kartındaki kategori etiketinin rengi (layouts/partials/kart.html)
  kartEtiket = "#b8cbe3"
  # Sahnedeki rakip
  rivalName = "Hadi Baba"
  rivalURL = "https://hadibaba.com/"
  rivalJab = "Pembe gözlükle futbol izlemek isteyenler için:"
  # Canlı skor / puan durumu veri adresi (skor-api/ Vercel projesi). Boşsa "çok yakında".
  skorAPI = "https://superlig-veri-ten.vercel.app"

  # Ziyaretçi sayacı (GoatCounter): https://yurubaba.goatcounter.com — boş bırakılırsa sayaç kapanır.
  goatcounter = "yurubaba"

  # Takım sayfalarının giriş cümlesi (%s = takım adı)
  takimGiris = "<strong>%s</strong> için duygu yok, rakam var: son 5 maç, sıradaki rakipler, puan sırası, kadro ve eksikler. %[1]s hakkında karar vereceksen önce tabloya bak."

  # Maç sayfalarının giriş cümlesi (1. %s = maç, 2. %s = tarih)
  macGiris = "<strong>%s</strong>. Tarih: %s. Kadrolar, olaylar ve istatistikler burada. Skordan önce isabetli şuta ve topla oynamaya bakın, maçı onlar anlatır. Görürüz."

  closingQuestion = "Siz ne diyorsunuz? Rakamla gelin, yorumlara yazın."

  # Yorumlar (Waline, kendi sunucumuz; iki site ortak).
  # serverURL boş bırakılırsa yazılarda "Yorum köşesi çok yakında" görünür.
  [params.waline]
    serverURL = "https://yorum.hadibaba.com"
    placeholder = "Rakamla gel, duyguyla değil."

  # Sosyal medya (başlıkta her sayfada görünür; partials/header.html)
  [[params.sosyal]]
    ad = "Instagram"
    url = "https://www.instagram.com/yurubabacom/"
  [[params.sosyal]]
    ad = "Threads"
    url = "https://www.threads.com/@yurubabacom"
  [[params.sosyal]]
    ad = "Facebook"
    url = "https://www.facebook.com/1450136994839927"
  [[params.sosyal]]
    ad = "Bluesky"
    url = "https://bsky.app/profile/yurubaba.bsky.social"
  [[params.sosyal]]
    ad = "Telegram"
    url = "https://t.me/yurubaba"

