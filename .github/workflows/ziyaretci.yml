# Dünün ziyaretçi özetini GoatCounter'dan okur (toplam + en çok okunan 5 sayfa).
# Sonuç Actions özetinde ve notice olarak görünür; sabah görevi dispatch edip annotations'tan okur.
# ay=gecen → aylık trend (görüntüleme, önceki aya göre değişim, reklam geliri senaryosu).
# Gerekli secret: GOATCOUNTER_TOKEN (GoatCounter → API → yalnızca "Read statistics").
name: Ziyaretçi raporu

on:
  workflow_dispatch:
    inputs:
      gun:
        description: "Gün (YYYY-AA-GG, İstanbul). Boş = dün"
        type: string
        default: ""
      ay:
        description: "Aylık trend: YYYY-AA ya da gecen (doluysa gün yok sayılır)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GoatCounter'dan oku
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GUN: ${{ inputs.gun }}
          AY: ${{ inputs.ay }}
        run: python3 scripts/ziyaretci.py
