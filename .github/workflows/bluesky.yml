# Site yayınlandıktan sonra yeni yazıları Bluesky, Telegram, Facebook, Instagram ve Threads'te paylaşır.
# Gerekli secret'lar (Settings → Secrets and variables → Actions):
#   BLUESKY_HANDLE        ör. yurubaba.bsky.social
#   BLUESKY_APP_PASSWORD  Bluesky → Ayarlar → Gizlilik ve güvenlik → Uygulama şifreleri
#   TELEGRAM_BOT_TOKEN    @BotFather'ın verdiği token (isteğe bağlı)
#   TELEGRAM_CHANNEL      ör. @yurubaba (isteğe bağlı)
#   META_PAGE_TOKEN       Facebook Sayfa anahtarı, süresiz; Instagram da bununla (isteğe bağlı)
#   THREADS_TOKEN         Threads anahtarı, 60 gün; meta_yenile.yml yeniler (isteğe bağlı)
# Secret'lar yoksa iş hata vermez, sadece "paylaşım atlandı" der.
name: Sosyal medyada paylaş

on:
  workflow_run:
    workflows: ["Siteyi yayınla"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme: paylaşmadan ne yapacağını göster"
        type: boolean
        default: true
      telegram_kontrol:
        description: "Sadece Telegram botunun kanala bağlı olduğunu kontrol et (hiçbir şey paylaşmaz)"
        type: boolean
        default: false
      meta_kontrol:
        description: "Sadece Facebook/Instagram/Threads anahtarlarını kontrol et (hiçbir şey paylaşmaz)"
        type: boolean
        default: false

permissions:
  contents: read

# Aynı anda iki paylaşım çalışmasın (çift gönderi olmasın)
concurrency:
  group: bluesky
  cancel-in-progress: false

jobs:
  paylas:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yeni yazıları paylaş (Bluesky, Telegram, Facebook, Instagram, Threads)
        env:
          SITE_FEED: https://yurubaba.com/index.xml
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_KONTROL: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_kontrol || 'false' }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          META_KONTROL: ${{ github.event_name == 'workflow_dispatch' && inputs.meta_kontrol || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          PAYLASIM_SAAT: "48"
          EN_FAZLA: "3"
          ETIKETLER: "#futbol"
          IG_ETIKETLER: "#futbol #süperlig #türkfutbolu"
        run: python3 scripts/bluesky_paylas.py
