# Yanlışlıkla iki kez giden Meta gönderilerini siler (Yürü hesapları). Kimlikler boşlukla ayrılır.
name: Meta gönderisi sil
on:
  workflow_dispatch:
    inputs:
      facebook: {description: "Facebook video/gönderi kimlikleri", type: string, default: ""}
      threads: {description: "Threads gönderi kimlikleri", type: string, default: ""}
      instagram: {description: "Instagram medya kimlikleri", type: string, default: ""}
jobs:
  sil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_SAYFA_ADI: "Yürü Baba"
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          FB: ${{ inputs.facebook }}
          TH: ${{ inputs.threads }}
          IG: ${{ inputs.instagram }}
        run: |
          python - <<'PY'
          import os, sys, json, urllib.request, urllib.error
          sys.path.insert(0, "scripts"); import meta
          def sil(url, token):
              req = urllib.request.Request(f"{url}?access_token={token}", method="DELETE")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return r.read().decode()[:200]
              except urllib.error.HTTPError as e: return f"HTTP {e.code}: {e.read().decode()[:300]}"
          k = meta.sayfa_kimlikleri(os.environ["META_PAGE_TOKEN"], os.environ["META_SAYFA_ADI"])
          for i in os.environ["FB"].split(): print(f"::notice title=Facebook sil {i}::{sil(f'{meta.GRAPH}/{i}', k['page_token'])}")
          for i in os.environ["IG"].split(): print(f"::notice title=Instagram sil {i}::{sil(f'{meta.GRAPH}/{i}', k['page_token'])}")
          for i in os.environ["TH"].split(): print(f"::notice title=Threads sil {i}::{sil(f'{meta.THREADS}/{i}', os.environ['THREADS_TOKEN'])}")
          PY
