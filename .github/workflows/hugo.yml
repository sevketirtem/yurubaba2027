# Her push'ta siteyi Hugo ile derler ve GitHub Pages'e yayınlar.
name: Siteyi yayınla

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # İleri tarihli yazılar zamanı gelince yayına girsin diye saatte bir yeniden derle
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.152.2
  TZ: Europe/Istanbul

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hugo'yu kur
        run: |
          wget -q -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Depoyu al
        uses: actions/checkout@v4
      # Yakın tarihli maçların ayrıntıları çalışmalar arasında saklanır (maç bitince de sayfada kalsın)
      - name: Maç ayrıntıları önbelleği
        uses: actions/cache@v4
        with:
          path: data/veri/mac
          key: veri-mac-${{ github.run_id }}
          restore-keys: veri-mac-
      # Skor API'sinden verileri çeker, maç sayfalarını üretir (scripts/veri_cek.py); hata derlemeyi durdurmaz
      - name: Verileri çek
        run: python3 scripts/veri_cek.py
      - name: Pages ayarlarını al
        id: pages
        uses: actions/configure-pages@v5
      - name: Siteyi derle
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Çıktıyı yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
